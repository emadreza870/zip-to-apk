name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'نام فایل ZIP پروژه اندروید (مثلاً app.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # نصب Gradle سیستمی برای تولید Wrapper
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded ZIP
        run: |
          echo "🔍 استخراج: ${{ inputs.project_zip }}"
          if [ ! -f "${{ inputs.project_zip }}" ]; then
            echo "❌ فایل ZIP پیدا نشد!"
            ls -la
            exit 1
          fi
          unzip -o "${{ inputs.project_zip }}" -d ./project
          echo "✅ محتویات پروژه:"
          find ./project -maxdepth 3 -type f | head -30

      - name: Prepare project (auto-fix missing files)
        id: prepare
        run: |
          set -e
          # پیدا کردن AndroidManifest.xml و مسیر ماژول app
          MANIFEST=$(find ./project -name "AndroidManifest.xml" -path "*/src/main/*" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml پیدا نشد!"
            exit 1
          fi
          APP_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          ROOT=$(dirname "$APP_DIR")
          APP_NAME=$(basename "$APP_DIR")
          echo "📁 ماژول app: $APP_DIR"
          echo "📁 ریشه پروژه: $ROOT"

          cd "$ROOT"

          # اگر gradlew نبود، فایل‌های ریشه را می‌سازیم
          if [ ! -f "gradlew" ]; then
            echo "🔧 فایل‌های Gradle گم‌شده‌اند. در حال ساخت..."

            # settings.gradle
            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              cat > settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MyApp"
include ':app'
EOF
            fi

            # build.gradle ریشه
            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              cat > build.gradle << 'EOF'
plugins {
    id 'com.android.application' version '8.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
EOF
            fi

            # gradle.properties
            if [ ! -f "gradle.properties" ]; then
              cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
EOF
            fi

            # تولید Gradle Wrapper
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "✅ پروژه آماده است."

      - name: Ensure app/build.gradle uses compatible plugin syntax
        run: |
          set -e
          ROOT="${{ steps.prepare.outputs.root }}"
          APP_BUILD="$ROOT/app/build.gradle"
          if [ ! -f "$APP_BUILD" ]; then
            APP_BUILD="$ROOT/app/build.gradle.kts"
          fi
          echo "📄 محتوای app/build.gradle:"
          cat "$APP_BUILD"

      - name: Build Debug APK
        working-directory: ${{ steps.prepare.outputs.root }}
        run: |
          echo "🔨 در حال ساخت APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK ساخته نشد."
            find ./project -name "*.apk"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "📦 APK: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

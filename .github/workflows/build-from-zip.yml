name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'نام فایل ZIP (مثلاً app.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded ZIP
        run: |
          echo "Extracting: ${{ inputs.project_zip }}"
          if [ ! -f "${{ inputs.project_zip }}" ]; then
            echo "ZIP file not found!"
            ls -la
            exit 1
          fi
          unzip -o "${{ inputs.project_zip }}" -d ./project
          find ./project -maxdepth 4 -type f | head -40

      - name: Prepare project
        id: prepare
        run: |
          set -e
          MANIFEST=$(find ./project -name "AndroidManifest.xml" -path "*/src/main/*" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi
          APP_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          ROOT=$(dirname "$APP_DIR")
          cd "$ROOT"
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null || echo "(missing)"
          echo "=== build.gradle (root) ==="
          cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null || echo "(missing)"

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              cat > settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          SETTINGS_EOF
            fi
            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              cat > build.gradle << 'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          ROOT_EOF
            fi
            if [ ! -f "gradle.properties" ]; then
              cat > gradle.properties << 'PROPS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS_EOF
            fi
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          echo "Project ready."

      # ============================================================
      # 🔧 Auto-patch deprecated APIs (این Step جدید است)
      # ============================================================
            - name: Auto-patch deprecated APIs
        run: |
          ROOT="${{ steps.prepare.outputs.root }}"
          echo "================================================"
          echo "Auto-patch starting. ROOT=$ROOT"
          echo "================================================"

          # نمایش فایل هدف قبل از پچ
          MAIN="$ROOT/app/src/main/java/com/cookieexporter/nonroot/MainActivity.kt"
          if [ -f "$MAIN" ]; then
            echo "=== MainActivity.kt lines 80-95 BEFORE patch ==="
            sed -n '80,95p' "$MAIN" || true
          fi

          echo ""
          echo "=== Files containing MIXED_CONTENT_ALWAYS_ALLOW ==="
          grep -rln "MIXED_CONTENT_ALWAYS_ALLOW" "$ROOT" \
            --include="*.kt" --include="*.java" 2>/dev/null || echo "(none found)"

          # پچ سراسری: هر جای عبارت را عوض کن (چه با WebSettings. چه بدون آن)
          find "$ROOT" \( -name "*.kt" -o -name "*.java" \) -type f -print0 \
            | while IFS= read -r -d '' f; do
                if grep -q "MIXED_CONTENT_ALWAYS_ALLOW" "$f"; then
                  echo "  Patching: $f"
                  sed -i \
                    -e 's/WebSettings\.MIXED_CONTENT_ALWAYS_ALLOW/WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE/g' \
                    -e 's/MIXED_CONTENT_ALWAYS_ALLOW/MIXED_CONTENT_COMPATIBILITY_MODE/g' \
                    "$f"
                fi
              done

          echo ""
          if [ -f "$MAIN" ]; then
            echo "=== MainActivity.kt lines 80-95 AFTER patch ==="
            sed -n '80,95p' "$MAIN" || true
          fi

          echo ""
          echo "=== Remaining MIXED_CONTENT_ALWAYS_ALLOW references ==="
          grep -rln "MIXED_CONTENT_ALWAYS_ALLOW" "$ROOT" \
            --include="*.kt" --include="*.java" 2>/dev/null && echo "STILL PRESENT!" || echo "(clean)"

          echo "Auto-patch done."
      # ============================================================

      - name: Show app/build.gradle
        run: |
          cat "${{ steps.prepare.outputs.root }}/app/build.gradle" || true

      - name: Build Debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ steps.prepare.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --warning-mode all 2>&1 | tee build-output.log
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.prepare.outputs.root }}/build-output.log
          retention-days: 7

      - name: Locate APK
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

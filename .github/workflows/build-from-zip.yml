name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'نام فایل ZIP (مثلاً app.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded ZIP
        run: |
          echo "Extracting: ${{ inputs.project_zip }}"
          if [ ! -f "${{ inputs.project_zip }}" ]; then
            echo "ZIP file not found!"
            ls -la
            exit 1
          fi
          unzip -o "${{ inputs.project_zip }}" -d ./project
          find ./project -maxdepth 4 -type f | head -40

      - name: Prepare project
        id: prepare
        run: |
          set -e
          MANIFEST=$(find ./project -name "AndroidManifest.xml" -path "*/src/main/*" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi
          APP_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          ROOT=$(dirname "$APP_DIR")
          cd "$ROOT"
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null || echo "(missing)"
          echo "=== build.gradle (root) ==="
          cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null || echo "(missing)"

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              cat > settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          SETTINGS_EOF
            fi
            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              cat > build.gradle << 'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          ROOT_EOF
            fi
            if [ ! -f "gradle.properties" ]; then
              cat > gradle.properties << 'PROPS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS_EOF
            fi
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          echo "Project ready."

      # ============================================================
      # 🔧 Auto-patch deprecated APIs (این Step جدید است)
      # ============================================================
      - name: Auto-patch deprecated APIs
        run: |
          set -e
          ROOT="${{ steps.prepare.outputs.root }}"
          echo "Patching deprecated APIs in: $ROOT"

          # شمارنده برای گزارش
          PATCHED=0

          # -----------------------------------------------------------------
          # 1) WebSettings.MIXED_CONTENT_ALWAYS_ALLOW → MIXED_CONTENT_COMPATIBILITY_MODE
          #    حذف‌شده در API 34
          # -----------------------------------------------------------------
          FILES=$(grep -rl "MIXED_CONTENT_ALWAYS_ALLOW" "$ROOT" --include="*.kt" --include="*.java" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | while read -r f; do
              echo "  Patched: $f"
              sed -i 's/WebSettings\.MIXED_CONTENT_ALWAYS_ALLOW/WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE/g' "$f"
              sed -i 's/import android\.webkit\.WebSettings\.MIXED_CONTENT_ALWAYS_ALLOW/import android.webkit.WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE/g' "$f"
            done
            PATCHED=$((PATCHED + 1))
          fi

          # -----------------------------------------------------------------
          # 2) BLUETOOTH / BLUETOOTH_ADMIN → BLUETOOTH_CONNECT / BLUETOOTH_SCAN
          #    deprecated در API 31
          # -----------------------------------------------------------------
          # این را در AndroidManifest.xml هم چک می‌کنیم
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'android.permission.BLUETOOTH"' "$MANIFEST" 2>/dev/null; then
              echo "  Bluetooth permission detected - leaving as-is (may need runtime request)"
            fi
          fi

          # -----------------------------------------------------------------
          # 3) Environment.getExternalStorageDirectory() → getExternalFilesDir()
          #    deprecated در API 29
          # -----------------------------------------------------------------
          FILES=$(grep -rl "Environment.getExternalStorageDirectory()" "$ROOT" --include="*.kt" --include="*.java" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | while read -r f; do
              echo "  WARNING: $f uses deprecated getExternalStorageDirectory() - not auto-patched (needs manual fix)"
            done
          fi

          # -----------------------------------------------------------------
          # 4) PackageManager.getInstalledPackages (بدون پارامتر) → با پارامتر
          #    deprecated از API 33
          # -----------------------------------------------------------------
          FILES=$(grep -rl "getInstalledPackages()" "$ROOT" --include="*.kt" --include="*.java" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | while read -r f; do
              echo "  Patched: $f (getInstalledPackages → getInstalledPackages(0))"
              sed -i 's/getInstalledPackages()/getInstalledPackages(0)/g' "$f"
            done
            PATCHED=$((PATCHED + 1))
          fi

          # -----------------------------------------------------------------
          # 5) registerReceiver بدون flag → با RECEIVER_NOT_EXPORTED
          #    الزامی از API 34
          # -----------------------------------------------------------------
          FILES=$(grep -rl "registerReceiver(.*IntentFilter" "$ROOT" --include="*.kt" --include="*.java" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | while read -r f; do
              echo "  NOTE: $f calls registerReceiver - may need RECEIVER_NOT_EXPORTED on API 34"
            done
          fi

          # -----------------------------------------------------------------
          # 6) پاک کردن importهای شبح‌زده و استفاده‌نشده (اختیاری)
          # -----------------------------------------------------------------
          # (اینجا کار خاصی نمی‌کنیم - کامپایلر خودش ignore می‌کند)

          echo ""
          echo "=========================================="
          echo "Auto-patch completed."
          echo "Patched categories: $PATCHED"
          echo "=========================================="

          # نمایش خلاصه‌ای از تغییرات در فایل‌های کاتلین
          echo ""
          echo "=== Final state of patched files (first 5 lines each) ==="
          find "$ROOT" -name "*.kt" -newer "$ROOT/gradlew" 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            head -5 "$f"
          done

      # ============================================================

      - name: Show app/build.gradle
        run: |
          cat "${{ steps.prepare.outputs.root }}/app/build.gradle" || true

      - name: Build Debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ steps.prepare.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --warning-mode all 2>&1 | tee build-output.log
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.prepare.outputs.root }}/build-output.log
          retention-days: 7

      - name: Locate APK
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

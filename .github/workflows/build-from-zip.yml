name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'نام فایل ZIP (مثلاً app.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded ZIP
        run: |
          echo "Extracting: ${{ inputs.project_zip }}"
          if [ ! -f "${{ inputs.project_zip }}" ]; then
            echo "ZIP file not found in repository root!"
            ls -la
            exit 1
          fi
          unzip -o "${{ inputs.project_zip }}" -d ./project
          find ./project -maxdepth 4 -type f | head -40

      - name: Prepare project
        id: prepare
        run: |
          MANIFEST=$(find ./project -name "AndroidManifest.xml" -path "*/src/main/*" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi
          APP_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          ROOT=$(dirname "$APP_DIR")
          cd "$ROOT"
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              cat > settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          SETTINGS_EOF
            fi
            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              cat > build.gradle << 'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          ROOT_EOF
            fi
            if [ ! -f "gradle.properties" ]; then
              cat > gradle.properties << 'PROPS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS_EOF
            fi
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          echo "Project ready."

      - name: Auto-patch deprecated APIs (Python)
        run: |
          ROOT="${{ steps.prepare.outputs.root }}"
          python3 - "$ROOT" << 'PYEOF'
          import os, sys, re
          root = sys.argv[1]
          print(f"Auto-patch root: {root}")
          patterns = [
              (r'\bMIXED_CONTENT_ALWAYS_ALLOW\b', 'MIXED_CONTENT_COMPATIBILITY_MODE',
               'MIXED_CONTENT_ALWAYS_ALLOW → COMPATIBILITY_MODE'),
              (r'\bgetInstalledPackages\s*\(\s*\)', 'getInstalledPackages(0)',
               'getInstalledPackages() → getInstalledPackages(0)'),
          ]
          total_files = 0
          total_changes = 0
          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not (fname.endswith('.kt') or fname.endswith('.java')):
                      continue
                  fpath = os.path.join(dirpath, fname)
                  try:
                      with open(fpath, 'r', encoding='utf-8') as f:
                          content = f.read()
                  except Exception as e:
                      print(f"  Skip {fpath}: {e}")
                      continue
                  original = content
                  changes_here = 0
                  for regex, repl, desc in patterns:
                      new_content, n = re.subn(regex, repl, content)
                      if n > 0:
                          print(f"  [{fname}] {desc}: {n} occurrence(s)")
                          content = new_content
                          changes_here += n
                  if content != original:
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)
                      total_files += 1
                      total_changes += changes_here
          print(f"Patched {total_changes} occurrence(s) in {total_files} file(s).")
          print("")
          print("=== Final check ===")
          remaining = 0
          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if fname.endswith('.kt') or fname.endswith('.java'):
                      fpath = os.path.join(dirpath, fname)
                      try:
                          with open(fpath, 'r', encoding='utf-8') as f:
                              if 'MIXED_CONTENT_ALWAYS_ALLOW' in f.read():
                                  print(f"  STILL PRESENT: {fpath}")
                                  remaining += 1
                      except: pass
          if remaining == 0:
              print("  (clean)")
          PYEOF

      - name: Dump MainActivity.kt for debugging
        run: |
          ROOT="${{ steps.prepare.outputs.root }}"
          echo "================ FULL MainActivity.kt ================"
          find "$ROOT" -name "MainActivity.kt" -type f -print0 | while IFS= read -r -d '' f; do
            echo "--- $f ---"
            cat -n "$f"
          done
          echo "================ END ================"

      - name: Build Debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ steps.prepare.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-output.log
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.prepare.outputs.root }}/build-output.log
          retention-days: 7

      - name: Locate APK
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

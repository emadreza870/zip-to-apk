name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'فایل ZIP پروژه اندروید را آپلود کنید'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کد ریپازیتوری
      - name: Checkout repository
        uses: actions/checkout@v4

      # ۲. نصب Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ۳. استخراج فایل ZIP آپلودشده
      - name: Extract uploaded ZIP
        run: |
          echo "🔍 در حال استخراج فایل ZIP..."
          unzip -o "${{ inputs.project_zip }}" -d ./project
          echo "✅ محتویات پروژه:"
          ls -la ./project

      # ۴. پیدا کردن مسیر ریشه پروژه (جایی که gradlew قرار دارد)
      - name: Locate project root
        id: find_root
        run: |
          ROOT=$(find ./project -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "project_root=$ROOT" >> $GITHUB_OUTPUT
          echo "📁 مسیر ریشه پروژه: $ROOT"

      # ۵. دادن دسترسی اجرا به gradlew
      - name: Make gradlew executable
        run: chmod +x ${{ steps.find_root.outputs.project_root }}/gradlew

      # ۶. ساخت APK دیباگ
      - name: Build Debug APK
        working-directory: ${{ steps.find_root.outputs.project_root }}
        run: |
          echo "🔨 در حال ساخت APK..."
          ./gradlew assembleDebug --stacktrace

      # ۷. پیدا کردن فایل APK ساخته‌شده
      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "📦 فایل APK پیدا شد: $APK_PATH"

      # ۸. آپلود APK به‌عنوان Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

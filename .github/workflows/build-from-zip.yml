name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'نام فایل ZIP پروژه اندروید (مثلاً my-project.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ نسخه v5 و بدون cache
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract uploaded ZIP
        run: |
          echo "🔍 در حال استخراج فایل ZIP: ${{ inputs.project_zip }}"
          if [ ! -f "${{ inputs.project_zip }}" ]; then
            echo "❌ فایل ZIP پیدا نشد! مطمئن شوید فایل را در ریشه ریپازیتوری قرار داده‌اید."
            ls -la
            exit 1
          fi
          unzip -o "${{ inputs.project_zip }}" -d ./project
          echo "✅ محتویات پروژه:"
          ls -la ./project

      - name: Locate project root
        id: find_root
        run: |
          ROOT=$(find ./project -name "gradlew" -type f | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "❌ فایل gradlew پیدا نشد! پروژه باید Gradle Wrapper داشته باشد."
            find ./project -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "project_root=$ROOT" >> $GITHUB_OUTPUT
          echo "📁 مسیر ریشه پروژه: $ROOT"

      - name: Make gradlew executable
        run: chmod +x ${{ steps.find_root.outputs.project_root }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.find_root.outputs.project_root }}
        run: |
          echo "🔨 در حال ساخت APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ هیچ فایل APK ساخته نشد."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "📦 فایل APK پیدا شد: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'نام فایل ZIP (مثلاً app.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded ZIP
        run: |
          echo "Extracting: ${{ inputs.project_zip }}"
          if [ ! -f "${{ inputs.project_zip }}" ]; then
            echo "ZIP file not found!"
            ls -la
            exit 1
          fi
          unzip -o "${{ inputs.project_zip }}" -d ./project
          find ./project -maxdepth 4 -type f | head -40

      - name: Prepare project
        id: prepare
        run: |
          set -e
          MANIFEST=$(find ./project -name "AndroidManifest.xml" -path "*/src/main/*" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi
          APP_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          ROOT=$(dirname "$APP_DIR")
          cd "$ROOT"
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

          if [ ! -f "gradlew" ]; then
            echo "Generating missing Gradle root files..."

            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              cat > settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          SETTINGS_EOF
            fi

            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              cat > build.gradle << 'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          ROOT_EOF
            fi

            if [ ! -f "gradle.properties" ]; then
              cat > gradle.properties << 'PROPS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS_EOF
            fi

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew
          echo "Project ready."

      - name: Show app/build.gradle for debugging
        run: |
          cat "${{ steps.prepare.outputs.root }}/app/build.gradle" || true

      - name: Build Debug APK
        working-directory: ${{ steps.prepare.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find ./project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
